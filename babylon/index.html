<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0E1018">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="description" content="RattleRamp — skate hra z baru U Chřestýše. Triky se kreslí prstem do mřížky 3×3, hraj v prohlížeči.">
  <title>RattleRamp</title>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ride-ui" hidden>
    <canvas id="pad"></canvas>
    <div id="stats" class="hud">
      <span id="score">0</span>
      <span id="combo" hidden></span>
      <span id="speed"><span id="speed-fill"></span></span>
      <span id="pro" hidden>PRO</span>
    </div>
    <div id="delta" class="hud"></div>
    <div id="popup" class="hud"></div>
    <div id="hints" class="hud"></div>
    <div id="statcard" hidden></div>
  </div>
  <div id="fps" class="hud" hidden></div>
  <script type="module" src="/src/game/main.ts"></script>
</body>
</html>
